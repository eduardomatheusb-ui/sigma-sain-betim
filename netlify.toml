[build]
  command = "pnpm build"
  publish = "dist/public"
  functions = "dist"

[build.environment]
  NODE_VERSION = "22.13.0"
  NODE_ENV = "production"

[functions]
  node_bundler = "zisi"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
