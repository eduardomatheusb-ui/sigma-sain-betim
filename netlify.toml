[build]
  command = "pnpm build"
  functions = "dist"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22.13.0"
  NODE_ENV = "production"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "pnpm build"

[context.deploy-preview]
  command = "pnpm build"

[context.branch-deploy]
  command = "pnpm build"

[functions]
  node_bundler = "esbuild"

[functions."*"]
  external_node_modules = ["express", "@tailwindcss/oxide", "lightningcss", "@babel/preset-typescript"]
